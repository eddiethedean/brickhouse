[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "brickhouse"
version = "0.1.0"
description = "Local, JVM-free Databricks behavioral emulation"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES/*.txt"]
dependencies = [
  "deltalake==1.2.1",
  "pyarrow==23.0.1",
  "sparkless==4.15.2",
  "sqlglot==30.24.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/brickhouse"
Repository = "https://github.com/eddiethedean/brickhouse"
Issues = "https://github.com/eddiethedean/brickhouse/issues"

[project.optional-dependencies]
notebooks = [
  "ipykernel==7.4.0",
  "jupyter-client==8.10.0",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
]

[project.scripts]
brickhouse = "brickhouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brickhouse"]

[tool.hatch.build.targets.sdist]
exclude = ["artifacts/releases/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["src/brickhouse", "scripts/validate_planning.py"]
python_version = "3.11"
strict = true
