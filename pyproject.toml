[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "brickhouse"
version = "0.1.0.dev0"
description = "Local, JVM-free Databricks behavioral emulation"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
delta = [
  "deltalake==1.2.1",
  "pyarrow==23.0.1",
]

[project.scripts]
brickhouse = "brickhouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brickhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["src/brickhouse", "scripts/validate_planning.py"]
python_version = "3.11"
strict = true
