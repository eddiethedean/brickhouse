name: Source checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install locked developer tools
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Validate plans and requirement selectors
        run: python scripts/validate_planning.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check formatting
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: |
          python -m mypy
          python -m mypy --strict scripts/provision_release_clients.py scripts/qualify_release.py scripts/verify_g1_local_only.py
