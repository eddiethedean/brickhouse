name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  qualification:
    needs: checks
    uses: ./.github/workflows/qualify.yml

  build:
    name: Build release distributions
    needs: [checks, qualification]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked developer tools
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Check release tag, package version, and license
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Release tag must be vMAJOR.MINOR.PATCH, got {tag!r}")
          if tag[1:] != project["version"]:
              raise SystemExit(
                  f"Tag {tag!r} does not match pyproject.toml version {project['version']!r}"
              )
          if project["name"] != "brickhouse":
              raise SystemExit(f"Unexpected distribution name: {project['name']!r}")
          if not (project.get("license") or Path("LICENSE").is_file()):
              raise SystemExit("Select the BrickHouse project license before publishing to PyPI")
          PY
      - name: Check versioned release-readiness checklist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"][1:]
          checklist = Path("artifacts/releases") / version / "release-checklist.md"
          if not checklist.is_file():
              raise SystemExit(f"Missing versioned release checklist: {checklist}")
          authorization = "- [ ] Explicitly authorize any public release build and publication."
          pending = [
              line.strip()
              for line in checklist.read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("- [ ]") and line.strip() != authorization
          ]
          if pending:
              raise SystemExit("Resolve release checklist gates before tagging:\n" + "\n".join(pending))
          PY
      - name: Download the distributions that passed every qualification lane
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: qualification-distributions
          path: dist/
      - name: Audit release distributions
        run: python scripts/audit_distribution.py --artifact-dir dist
      - name: Upload release distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/brickhouse
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
