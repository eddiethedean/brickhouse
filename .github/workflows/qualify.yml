name: Release qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  candidate:
    name: Build one candidate for every qualification lane
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          check-latest: true
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Build candidate distributions
        run: python -m build --no-isolation
      - name: Audit metadata, license, and retained notices
        run: python scripts/audit_distribution.py --artifact-dir dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: qualification-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  matrix:
    name: Offline G1–G4 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: qualification-distributions
          path: dist/
      - name: Install hash-locked native Python provisioning tool
        run: python -m pip install --require-hashes -r requirements/qualification-tools.txt
      - name: Provision the exact qualification interpreter
        run: |
          python scripts/provision_qualification_python.py --python-version "${{ matrix.python-version }}" --destination "$RUNNER_TEMP/brickhouse-python" --output "$RUNNER_TEMP/qualification/python-provisioning.json"
      - name: Provision pinned, hash-verified clients before offline execution
        run: |
          "$QUALIFICATION_PYTHON" scripts/provision_release_clients.py --destination "$RUNNER_TEMP/brickhouse-clients" --output "$RUNNER_TEMP/brickhouse-clients.json"
      - name: Qualify installed base and notebook wheels, then the complete source suite
        run: |
          "$QUALIFICATION_PYTHON" scripts/qualify_release.py --clients "$RUNNER_TEMP/brickhouse-clients.json" --output-dir "$RUNNER_TEMP/qualification" --full-source
      - name: Capture native macOS sandbox denials when qualification fails
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/qualification"
          sudo -n /usr/bin/log show --last 20m --style compact --predicate 'eventMessage CONTAINS "deny" AND eventMessage CONTAINS "databricks"' > "$RUNNER_TEMP/qualification/macos-sandbox-denials.log" 2>&1 || true
      - name: Retain exact artifact hashes, zero-skip counts, and isolation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: qualification-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/qualification/
          if-no-files-found: error
          retention-days: 14
